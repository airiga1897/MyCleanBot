name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks CLI
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$release/$archive"
          curl --fail --location --silent --show-error --output "$checksums" "$release/$checksums"
          grep " ${archive}$" "$checksums" | sha256sum --check -
          tar --extract --gzip --file "$archive" gitleaks
          sudo install --mode 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan full Git history for secrets
        run: gitleaks git --redact=100 --verbose .

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mycleanbot
          POSTGRES_USER: mycleanbot
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mycleanbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mycleanbot:test-password@127.0.0.1:5432/mycleanbot
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "poetry==2.4.1"
      - run: poetry install --with dev --no-root
      - name: Generate ephemeral encryption key
        shell: bash
        run: |
          key="$(poetry run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          echo "MASTER_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"
      - run: poetry check
      - run: poetry run ruff check .
      - run: poetry run mypy config core
      - run: poetry run python manage.py check --deploy
      - run: poetry run python manage.py makemigrations --check --dry-run
      - run: poetry run coverage run -m pytest
      - run: poetry run coverage report

  docker:
    runs-on: ubuntu-latest
    needs: [python, secret-scan]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mycleanbot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
