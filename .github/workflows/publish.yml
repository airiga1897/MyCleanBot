name: Publish immutable image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.ref.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,format=long
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - id: ref
        shell: bash
        run: |
          image_name="$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image_ref=${image_name}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: publish
    runs-on: ubuntu-latest
    env:
      PLATFORM_DISPATCH_TOKEN: ${{ secrets.PLATFORM_DISPATCH_TOKEN }}
    steps:
      - name: Hand immutable image to AI Service Platform
        if: env.PLATFORM_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.PLATFORM_DISPATCH_TOKEN }}
          IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api --method POST repos/airiga1897/AI_Service_Platform/dispatches \
            -f event_type=mycleanbot-image-published \
            -F "client_payload[instance]=mycleanbot" \
            -F "client_payload[environment]=prod" \
            -F "client_payload[image_ref]=$IMAGE_REF" \
            -F "client_payload[source_sha]=$SOURCE_SHA"
